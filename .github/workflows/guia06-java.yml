name: Verificar Guia 06 Java
on:
  push:
    paths:
      - 'practica_06/**'
      - '.github/workflows/guia06-java.yml'
  workflow_dispatch:
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar proyectos independientemente
        run: |
          set -e
          for dir in practica_06/actividad_{1,2,3} practica_06/ejercicio_{1,2,3,4,5}; do
            echo "Compilando $dir"
            (cd "$dir" && javac Main.java)
          done
      - name: Ejecutar pruebas básicas de consola
        run: |
          set -e
          printf '0\n' | java -cp practica_06/actividad_1 Main
          printf '0\n' | java -cp practica_06/actividad_2 Main
          printf '0\n' | java -cp practica_06/actividad_3 Main
          printf '0\n' | java -cp practica_06/ejercicio_1 Main
          printf '0\n' | java -cp practica_06/ejercicio_2 Main
          printf '0\n' | java -cp practica_06/ejercicio_3 Main
          printf '0\n' | java -cp practica_06/ejercicio_4 Main
          printf '0\n' | java -cp practica_06/ejercicio_5 Main
